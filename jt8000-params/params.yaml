    visible_when: {param: filter.engine, is: VA}
  - id: 0x0187            # v1: CC::FILTER_OCTAVE_CONTROL (was CC 84)
    key: filter.octave_control
    name: "Oct Control"
    label: "OCT CTRL"
    type: continuous
    scope: patch
    range: {min: 0, max: 1, curve: lin}
    unit: "norm"
    # 0.4 norm × 10 = 4.0 octaves — restores v1's power-on default filter-mod
    # depth (v1 FilterBlock _octaveControl = 4.0f; CC scaling norm×10, see
    # SynthEngine::handleCC FILTER_OCTAVE_CONTROL). Env-amount and key-track
    # both default to 0, so the *silent* default patch is unchanged; this only
    # restores v1 depth once the user opens env-amount or key-track.
    default: 0.4
    smooth_ms: 5
    ui: {section: 3, group: 2}
