  # ---- [6] Pitch Envelope ----
  - id: 0x0300            # v1: CC::PITCH_ENV_DEPTH (was CC 69)
    key: env_pitch.depth
    name: "Pitch Depth"
    label: "DEPTH"
    type: continuous
    scope: patch
    range: {min: -1, max: 1, curve: lin}
    unit: "norm"
    bipolar_display: true
    default: 0
    smooth_ms: 5
    # ui.control OVERRIDES the default binding policy (continuous -> pot).
    #
    # Without it this lands on pot A1, which pushes ATTACK/DECAY/SUSTAIN/RELEASE
    # down one slot on the Pitch envelope ONLY — so the three envelope pages
    # would not share a pot layout and muscle memory would not transfer.
    # Binding it to an encoder keeps pots A1..A7 identical across all three.
    #
    # It also suits the parameter: bipolar and set-and-forget, an encoder detent
    # gives finer control near zero than a pot, and an encoder push re-centres
    # to exactly 0.0 — which a pot cannot reliably hit.
    ui: {section: 6, group: 0, control: encoder}
