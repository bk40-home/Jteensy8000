# =============================================================================
# platformio.ini — JT-8000 v2 build environments (design brief §8)
# =============================================================================
# One codebase, three hardware targets — the backend is the ONLY difference
# between environments.  Build with:  pio run -e jt8000-pcm5102
#
# OFFLINE NOTE: 'lib_deps' fetches OpenAudio from GitHub on first build.
# If you are offline, comment lib_deps out and point lib_extra_dirs at your
# existing v1 library folder instead (see OFFLINE_TESTING.md S0).
# =============================================================================

[platformio]
default_envs = jt8000-pcm5102

[env]
platform      = teensy
board         = teensy41
framework     = arduino
build_unflags = -std=gnu++14
build_flags   =
    -std=gnu++17
    -O2
    -Wall
    -Wextra
    -Wdouble-promotion
    -D USB_MIDI_AUDIO_SERIAL
; USB host audio defaults ON where the backend has a return mixer.  Build with
 ;  -D JT_USBHOST_AUDIO=0
; for a MIDI-only host port (also the fastest way to rule the audio path out).
    -I src
    -DJT_DEBUG_CLOCK
; Filter-drive triage: adds drvStore / drv / drvOn / va / vaType to the
; 1 Hz [S3.5] status line.  Comment out once drive is confirmed.
;  -DJT_DEBUG_DRIVE
; F7: 600 MHz default — set by NOT defining JT_CPU_720MHZ.  Add
;   -D JT_CPU_720MHZ
; for standalone (non-USB-audio) use only; see BoardConfig.h for the
; known USB-audio degradation at 720 MHz.
lib_deps =
    https://github.com/chipaudette/OpenAudio_ArduinoLibrary.git
    fortyseveneffects/MIDI Library@^5.0.2   ; Serial1 link (Phase B')
    ;https://github.com/A-Dunstan/teensy4_usbhost.git  ; USB host: MIDI + audio
    https://github.com/bk40-home/teensy4_usbhost.git
;
; Tracked straight from upstream, with NO local patch.  An earlier version of
; this port carried a modified copy of the library; it no longer does, and it
; should not again without a very good reason — a git dependency silently
; overrides a local copy with no warning, which is an afternoon nobody needs
; to repeat.
;
; The one thing this library needs from us: its threading layer points MSP at a
; 2 KB interrupt stack, which is not enough for an audio engine that renders
; from a software interrupt.  platform/IsrStack installs a larger one at the
; top of setup(), which is the library author's own suggested approach.  See
; DEFERRALS_LEDGER.md D-13.
; USB HOST: USBHost_t36 (bundled with Teensyduino) is NO LONGER USED.  It has
; no isochronous transport, so it can carry MIDI from the host port but never
; audio.  teensy4_usbhost has both.  The two drive the same EHCI controller
; and cannot coexist.
;
; SUBMODULE TRAP: that repo pulls TeensyAtomThreads as a git submodule.  A
; plain 'Download ZIP' omits it and the build fails on a missing
; TeensyAtomThreads.h.  PlatformIO's git fetch handles it; if you vendor the
; library by hand instead, clone with --recursive, or drop the submodule's
; contents into <lib>/teensy4_usbhost/src/TeensyAtomThreads/.
; Offline alternative (uncomment, adjust path, comment lib_deps above):
lib_extra_dirs = ../Jteensy8000/libs

; test/ and tools/ are host-only (make test / make render) and sit outside
; src/, so PlatformIO never compiles them — no filters needed.

[env:jt8000-pcm5102]
build_flags = ${env.build_flags} -D JT_BACKEND_PCM5102

[env:jt8000-sgtl5000]
build_flags = ${env.build_flags} -D JT_BACKEND_SGTL5000

[env:jt8000-usbonly]
build_flags = ${env.build_flags} -D JT_BACKEND_USBONLY
